<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jess 財務顧問工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16323F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JK Finance">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16323F;
    --ink-deep:#0F232C;
    --paper:#F5F7F6;
    --brass:#2E7391;
    --brass-light:#8FC4D8;
    --line:rgba(245,247,246,0.10);
    --text-dim:rgba(245,247,246,0.62);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Noto Sans TC", sans-serif;
    background:var(--paper);
    overflow:hidden;
  }

  .shell{display:flex; height:100vh; width:100vw;}
  .mobile-topbar{display:none;}
  .drawer-overlay{display:none;}

  /* ---------- Sidebar ---------- */
  aside.sidebar{
    width:260px; flex-shrink:0;
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-deep) 100%);
    color:var(--paper);
    display:flex; flex-direction:column;
    border-right:1px solid var(--line);
  }
  .brand{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .brand-home-link{
    display:inline-block; font-size:10px; color:rgba(245,247,246,0.5);
    text-decoration:none; margin-bottom:8px; transition:color .15s ease;
  }
  .brand-home-link:hover{color:var(--brass-light);}
  .brand .eyebrow{
    font-family:"Roboto Mono", monospace;
    font-size:9px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--brass-light); margin-bottom:6px;
  }
  .brand h1{
    font-family:"Noto Serif TC", serif;
    font-weight:800; font-size:15px; margin:0 0 4px; line-height:1.3;
    letter-spacing:.01em;
  }
  .brand .who{font-size:10.5px; color:var(--text-dim);}

  nav.modules{flex:1; overflow-y:auto; padding:16px 12px;}
  .nav-group{margin-bottom:6px;}
  .nav-group-header{
    width:100%; display:flex; flex-direction:row; align-items:center; justify-content:space-between;
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:"Roboto Mono", monospace; font-size:10px; letter-spacing:.14em;
    color:rgba(245,247,246,0.5); text-transform:uppercase;
    padding:10px 10px 8px;
  }
  .nav-group-header:hover{color:rgba(245,247,246,0.8);}
  .nav-group-header .chevron{font-size:10px; transition:transform .18s ease; color:rgba(245,247,246,0.4);}
  .nav-group.collapsed .nav-group-header .chevron{transform:rotate(-90deg);}
  .nav-group-body{overflow:hidden; max-height:600px; transition:max-height .22s ease;}
  .nav-group.collapsed .nav-group-body{max-height:0;}
  nav.modules button{
    width:100%; text-align:left; appearance:none; border:none; background:none;
    color:var(--text-dim); cursor:pointer;
    padding:12px 12px; border-radius:8px; margin-bottom:4px;
    display:flex; flex-direction:column; gap:2px;
    transition:background .15s ease, color .15s ease;
    border-left:2px solid transparent;
  }
  nav.modules button .name{
    font-size:14px; font-weight:600; color:inherit;
    display:flex; align-items:center; gap:9px;
  }
  nav.modules button .name .num{
    font-family:"Roboto Mono", monospace; font-size:10.5px; color:var(--brass);
    width:16px; flex-shrink:0;
  }
  nav.modules button .desc{
    font-size:11px; color:rgba(245,247,246,0.4);
    padding-left:25px; line-height:1.5;
  }
  nav.modules button:hover{background:rgba(245,247,246,0.05); color:var(--paper);}
  nav.modules button.active{
    background:rgba(46,115,145,0.18);
    color:var(--paper);
    border-left-color:var(--brass);
  }
  nav.modules button.active .desc{color:rgba(245,247,246,0.6);}

  .user-box{
    display:flex; align-items:center; gap:10px;
    padding:14px 22px; border-top:1px solid var(--line);
  }
  .user-avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,var(--brass) 0%,var(--brass-light) 100%);
    color:var(--ink-deep); font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif TC", serif;
  }
  .user-info{flex:1; min-width:0;}
  .user-name{font-size:13px; font-weight:600; color:var(--paper); margin-bottom:2px;}
  .logout-btn{
    appearance:none; border:none; background:none; padding:0;
    font-size:11px; color:rgba(245,247,246,0.45); cursor:pointer;
    text-decoration:underline; text-underline-offset:2px;
  }
  .logout-btn:hover{color:var(--brass-light);}

  .sidebar-footer{
    padding:16px 22px 22px; border-top:1px solid var(--line);
    font-size:11px; color:rgba(245,247,246,0.34); line-height:1.7;
  }
  .sidebar-footer .plus{color:var(--brass-light); font-weight:600;}

  /* ---------- Main content ---------- */
  main{flex:1; height:100vh; position:relative; background:var(--paper);}
  iframe{
    width:100%; height:100%; border:none; display:none;
    position:absolute; top:0; left:0;
  }
  iframe.active{display:block;}

  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:#8B8168; font-family:"Roboto Mono", monospace;
    font-size:12px; background:var(--paper); pointer-events:none; opacity:0; transition:opacity .15s; z-index:5;
  }
  .loading.show{opacity:1;}

  @media (max-width:820px){
    body{display:flex; flex-direction:column;}
    .shell{height:auto; flex:1; min-height:0;}

    /* ---------- 手機頂部窄列：漢堡按鈕 + 目前模組名稱 ---------- */
    .mobile-topbar{
      display:flex; align-items:center; gap:12px; flex-shrink:0;
      background:var(--ink-deep); color:var(--paper);
      padding:12px 16px; padding-top:calc(12px + env(safe-area-inset-top));
      border-bottom:1px solid var(--line);
    }
    .mobile-menu-btn{
      appearance:none; border:none; background:none; color:var(--paper);
      font-size:22px; line-height:1; cursor:pointer; padding:4px 6px;
      flex-shrink:0;
    }
    .mobile-current-name{
      font-family:"Noto Serif TC", serif; font-weight:700; font-size:14px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    /* 桌機版側邊欄在手機上完全隱藏，改用抽屜疊層顯示 */
    aside.sidebar{
      position:fixed; inset:0; z-index:200; width:100%; height:100%;
      flex-direction:column; transform:translateX(-100%); transition:transform .22s ease;
      overflow-y:auto;
    }
    aside.sidebar.drawer-open{transform:translateX(0);}

    .brand{flex-shrink:0; padding-top:calc(18px + env(safe-area-inset-top));}
    nav.modules{display:block; flex:1; padding:16px 12px;}
    nav.modules button{width:100%; white-space:normal; margin-bottom:4px; border-left:2px solid transparent; border-bottom:none;}
    nav.modules button .desc{display:block;}
    nav.modules button.active{border-left-color:var(--brass); border-bottom-color:transparent;}
    .nav-group-body{max-height:2000px;} /* 手機抽屜是整頁捲動，不需要靠max-height限制高度 */
    .nav-group.collapsed .nav-group-body{max-height:0;}
    .user-box{flex-shrink:0;}

    .drawer-overlay{
      display:none; position:fixed; inset:0; background:rgba(15,35,44,0.5); z-index:190;
    }
    .drawer-overlay.show{display:block;}

    main{height:auto; flex:1; min-height:0;}
  }
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="mobile-menu-btn" id="btnMobileMenu" aria-label="開啟選單">☰</button>
  <div class="mobile-current-name" id="mobileCurrentName">首頁</div>
</div>
<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <a href="index.html" class="brand-home-link" title="離開工作台，回到官網">← 離開工作台</a>
      <div class="eyebrow">Financial Advisor Workspace</div>
      <h1 id="brandHomeBtn" style="cursor:pointer;" title="回到工作台首頁">資產配置工作台</h1>
      <div class="who">覺醒 × 金錢 × 故事</div>
    </div>

    <nav class="modules" id="nav">
      <div class="nav-group" data-group="explore">
        <button class="nav-group-header">
          <span>客戶探索</span>
          <span class="chevron">▾</span>
        </button>
        <div class="nav-group-body">
          <button class="mod-btn" data-target="frame-blueprint">
            <span class="name"><span class="num">◆</span>財富地圖</span>
            <span class="desc">顧問式引導問卷／財富畫像報告</span>
          </button>
          <button class="mod-btn" data-target="frame-clientrecords">
            <span class="name"><span class="num">◆</span>客戶資料</span>
            <span class="desc">已填答的財富地圖紀錄（存在本機）</span>
          </button>
        </div>
      </div>

      <div class="nav-group" data-group="market">
        <button class="nav-group-header">
          <span>市場情報</span>
          <span class="chevron">▾</span>
        </button>
        <div class="nav-group-body">
          <button class="mod-btn" data-target="frame-marketnews">
            <span class="name"><span class="num">◆</span>市場快訊</span>
            <span class="desc">即時財經新聞／自動分類／標明出處</span>
          </button>
          <button class="mod-btn" data-target="frame-marketoverview">
            <span class="name"><span class="num">◆</span>市場概況</span>
            <span class="desc">即時匯率／全球指數／大盤走勢</span>
          </button>
        </div>
      </div>

      <div class="nav-group" data-group="tools">
        <button class="nav-group-header">
          <span>試算工具箱</span>
          <span class="chevron">▾</span>
        </button>
        <div class="nav-group-body">
          <button class="mod-btn" data-target="frame-simulation">
            <span class="name"><span class="num">01</span>沙盤推演必勝</span>
            <span class="desc">退休／購屋／教育／遺贈／投資試算機</span>
          </button>
          <button class="mod-btn" data-target="frame-cashflow">
            <span class="name"><span class="num">02</span>收支現金流</span>
            <span class="desc">收入／支出／年度結餘／儲蓄率</span>
          </button>
          <button class="mod-btn" data-target="frame-balance">
            <span class="name"><span class="num">03</span>資產負債表</span>
            <span class="desc">資產／負債／淨值／負債比</span>
          </button>
          <button class="mod-btn" data-target="frame-loan">
            <span class="name"><span class="num">04</span>貸款試算室</span>
            <span class="desc">車貸信貸／房貸／寬限期／利差</span>
          </button>
          <button class="mod-btn" data-target="frame-efficiency">
            <span class="name"><span class="num">05</span>資金效率健檢</span>
            <span class="desc">通膨與資金效率快篩</span>
          </button>
        </div>
      </div>
    </nav>

    <div class="user-box">
      <div class="user-avatar" id="userAvatar">J</div>
      <div class="user-info">
        <div class="user-name" id="userName">Jess</div>
        <button class="logout-btn" id="logoutBtn">登出</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="loading show" id="loading">載入模組中…</div>
    <iframe class="active" id="frame-home" src="modules/home.html" title="首頁"></iframe>
    <iframe id="frame-cashflow" src="modules/cashflow.html" title="收支現金流"></iframe>
    <iframe id="frame-blueprint" src="modules/blueprint.html" title="財富地圖"></iframe>
    <iframe id="frame-clientrecords" src="modules/client-records.html" title="客戶資料"></iframe>
    <iframe id="frame-balance" src="modules/balance.html" title="資產負債表"></iframe>
    <iframe id="frame-loan" src="modules/loan.html" title="貸款試算室"></iframe>
    <iframe id="frame-efficiency" src="modules/efficiency.html" title="資金效率健檢"></iframe>
    <iframe id="frame-marketnews" src="modules/market-news.html" title="市場快訊"></iframe>
    <iframe id="frame-marketoverview" src="modules/market-overview.html" title="市場概況"></iframe>
    <iframe id="frame-simulation" src="modules/simulation.html" title="沙盤推演必勝"></iframe>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  /* ---------- 登入狀態驗證（真正串接 Supabase） ---------- */
  (async function checkAuth(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
      window.location.href = 'login.html';
      return;
    }
    const user = session.user;
    const name = user.user_metadata?.display_name || user.email || '顧問';
    document.getElementById('userName').textContent = name;
    document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
    window.currentAdvisorId = user.id; // 讓內嵌的模組（例如客戶資料）之後可以用這個 id 存取自己的資料
  })();

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  const buttons = document.querySelectorAll('.mod-btn');
  const frames = document.querySelectorAll('main iframe');
  const loading = document.getElementById('loading');

  // 只要「目前要顯示的那一頁」載入完成就先讓畫面出現，不用等其他背景模組全部載完，
  // 避免手機網路較慢時，某一個模組卡住就讓整個畫面一直停在「載入模組中」出不來。
  const initialFrame = document.getElementById('frame-home');
  function hideLoading(){ loading.classList.remove('show'); }
  initialFrame.addEventListener('load', hideLoading, {once:true});
  // 保險：就算真的卡住，最多 8 秒後還是強制讓畫面出現，不讓使用者被永遠卡住
  setTimeout(hideLoading, 8000);

  function activateFrame(targetId){
    buttons.forEach(b=> b.classList.toggle('active', b.dataset.target === targetId));
    frames.forEach(f=> f.classList.toggle('active', f.id === targetId));
    const activeBtn = Array.from(buttons).find(b=> b.dataset.target === targetId);
    const nameEl = document.getElementById('mobileCurrentName');
    if(nameEl){
      nameEl.textContent = activeBtn ? activeBtn.querySelector('.name').textContent : '首頁';
    }
    closeMobileDrawer();
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.classList.contains('active')) return;
      activateFrame(btn.dataset.target);
    });
  });

  // 點「資產配置工作台」標題 → 回到工作台內部首頁（不對應任何選單項目，所以不會有按鈕被反白）
  document.getElementById('brandHomeBtn').addEventListener('click', ()=>{
    activateFrame('frame-home');
  });
  // 讓內嵌的 iframe（例如財富地圖）可以呼叫這個函式跳回首頁
  window.goToHome = ()=> activateFrame('frame-home');

  // ---- 手機版：漢堡選單開關全螢幕抽屜 ----
  const sidebarEl = document.querySelector('aside.sidebar');
  const drawerOverlayEl = document.getElementById('drawerOverlay');
  function openMobileDrawer(){
    sidebarEl.classList.add('drawer-open');
    drawerOverlayEl.classList.add('show');
  }
  function closeMobileDrawer(){
    sidebarEl.classList.remove('drawer-open');
    drawerOverlayEl.classList.remove('show');
  }
  document.getElementById('btnMobileMenu').addEventListener('click', ()=>{
    if(sidebarEl.classList.contains('drawer-open')) closeMobileDrawer();
    else openMobileDrawer();
  });
  drawerOverlayEl.addEventListener('click', closeMobileDrawer);

  // ---- 側邊欄分類：展開／收起，每次進工作台一律預設全部收合（不記憶跨次狀態） ----
  document.querySelectorAll('.nav-group').forEach(group=>{
    group.classList.add('collapsed');
    group.querySelector('.nav-group-header').addEventListener('click', ()=>{
      group.classList.toggle('collapsed');
    });
  });

  // ---- PWA：註冊 Service Worker（讓「加到主畫面」可以像 App 一樣全螢幕開啟） ----
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>

</body>
</html>
